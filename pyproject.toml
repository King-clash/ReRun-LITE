# Tool settings only (Rerun is not installed as a package). Lint: py -m pip install ruff; py -m ruff check .
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dist", "release", "build", "backups", "debug", "debug_crest"]

[tool.ruff.lint]
# Real-bug classes only: syntax errors, undefined names, unused imports/variables, redefinitions.
select = ["E9", "F63", "F7", "F82", "F401", "F841", "F811"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]          # tests import things for side effects / smoke checks
"gsc_app/test_page.py" = ["F841"]
"tools/keygen.py" = ["F841"]          # a widget builder is called for its side effect
